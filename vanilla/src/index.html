<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering TailwindCSS</title>
    <link rel="stylesheet" href="styles/index.css">
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="p-10 flex flex-col gap-4">
      <!--
        Mobile First: desenvolver a aplicação pensando primeiro no layout
        mobile (como ele deve se comportar em telas pequenas). Após isso,
        adaptar o layout em telas maiores.

        "Tailwind uses a mobile-first breakpoint system, similar to what you
        might be used to in other frameworks like Bootstrap."

        Por padrão, aplique "text-center", e para telas acima de 640px,
        aplique text-left:
        class="text-center sm:text-left"
      -->

      <div class="bg-red-500 sm:bg-red-300 md:bg-red-500 lg:bg-blue-500 h-10">
        <span class="hidden sm:max-lg:inline">Texto</span>
      </div>

      <ul
        class="space-y-2  *:bg-blue-50 *:border *:border-blue-100 [&_span]:text-blue-500"
      >
        <li>Item 1</li>
        <li>Item 2</li>
        <li><span>Item 3</span></li>
        <li><span>Item 4</span></li>
      </ul>

      <input
        type="text"
        class="border border-zinc-300 rounded-md outline-none px-2 h-12 focus:ring-blue-500 focus:ring-2 transition-colors duration-300"
      >

      <button
        type="button"
        class="bg-blue-500 p-2 hover:bg-blue-500/80 text-white rounded-md font-medium h-12 cursor-pointer transition-all duration-300 outline-none focus:border-blue-700 border border-blue-500 active:translate-y-0.5 active:bg-blue-700 disabled:bg-zinc-500 after:bg-red-500 after:size-5 after:absolute after:left-0 before:bg-green-500 before:size-5 before:absolute before:right-0 relative"
        disabled
      >
        Enviar
      </button>
    </div>
  </body>
</html>
