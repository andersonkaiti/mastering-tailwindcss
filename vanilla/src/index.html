<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering TailwindCSS</title>
    <!--
      O TailwindCSS gera os preflights styles, que são "resets", então mesmo
      que à primeira vista não tenha nenhum estilo no HTML, a identidade visual
      gerada já é diferente da padrão.
      
      Segunda a documentação do TailwindCSS:
      - "An opinionated set of base styles for Tailwind projects."
    -->
    <link rel="stylesheet" href="styles/index.css">
  </head>
  <body>
    <h1 class="text-emerald-500 text-3xl">Hello, TailwindCSS!</h1>
  </body>
</html>
